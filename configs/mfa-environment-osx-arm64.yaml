name: indic-codec-probe-mfa
channels:
  - conda-forge
dependencies:
  - python=3.11.16
  - montreal-forced-aligner=3.1.3=pyhd8ed1ab_1
  - kalpy=0.6.5=cpu_py311hdcf3481_1
  - kaldi=5.5.1112=cpu_h175306b_7
  - openfst=1.8.3=h950e60b_3
  - praatio=6.0.0=pyhd8ed1ab_0
