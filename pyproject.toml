[project]
name = "indic-codec-probe"
version = "0.1.0"
description = "Reproducible probing of Mimi codebook specialization on Hindi and Telugu"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.1",
  "pyyaml>=6.0",
]

[project.scripts]
indic-codec-probe = "indic_codec_probe.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["indic_codec_probe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
